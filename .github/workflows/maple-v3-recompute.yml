name: Maple V3 recompute

on:
  push:
    paths:
      - 'Maple/scripts/recompute_per_capita_v3.py'
      - '.github/workflows/maple-v3-recompute.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute V3
        run: python Maple/scripts/recompute_per_capita_v3.py
      - name: Commit generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Maple/data/per_capita_production_v3_weekly.csv Maple/data/per_capita_production_v3_season_summary.csv
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Generate dual-anchor V3 per-capita series'
            git push
          fi
