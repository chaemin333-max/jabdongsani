name: Maple canonical chart
on:
  push:
    paths:
      - 'Maple/scripts/render_per_capita_canonical.py'
      - 'Maple/data/per_capita_production_v3_weekly.csv'
      - '.github/workflows/maple-render-canonical.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependencies and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install matplotlib
      - name: Render canonical chart
        run: python Maple/scripts/render_per_capita_canonical.py
      - name: Commit chart
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Maple/figures/per_capita_production_v3_canonical.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Render canonical per-capita production chart'
          git push
