name: Maple V3 chart

on:
  push:
    paths:
      - 'Maple/scripts/render_per_capita_v3_chart.py'
      - 'Maple/data/per_capita_production_v3_weekly.csv'
      - '.github/workflows/maple-v3-chart.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies and Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --quiet matplotlib
      - name: Render exact-data chart
        run: python Maple/scripts/render_per_capita_v3_chart.py
      - name: Commit chart
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Maple/figures/per_capita_production_v3_canonical.png
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Render canonical V3 per-capita chart'
            git push
          fi
